<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Realidade Aumentada — Museu</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    /*
     * Cena ocupando toda a área visível do navegador.
     */
    #cena-ra {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    /*
     * O canvas precisa permanecer transparente para que
     * a imagem real da câmera apareça por trás dele.
     */
    .a-canvas,
    canvas.a-canvas,
    canvas[data-aframe-canvas] {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: transparent !important;
      opacity: 1 !important;
      z-index: 2 !important;
    }

    /*
     * Vídeo da câmera criado automaticamente pelo MindAR.
     * O vídeo da obra tem ID "video-ra" e fica excluído desta regra.
     */
    video:not(#video-ra) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000000 !important;
      z-index: 0 !important;
    }

    /*
     * O vídeo usado como textura não deve aparecer como elemento comum.
     */
    #video-ra {
      display: none !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal,
    .a-dialog,
    .a-loader,
    .a-loader-title {
      display: none !important;
    }

    #tela-inicial {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100dvh;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(24px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(24px + env(safe-area-inset-left));
      background: rgba(0, 0, 0, 0.94);
      color: #ffffff;
      text-align: center;
    }

    #conteudo-inicial {
      width: 100%;
      max-width: 430px;
    }

    #conteudo-inicial h1 {
      margin: 0 0 16px;
      font-size: 25px;
      line-height: 1.2;
    }

    #conteudo-inicial p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.5;
    }

    #botao-iniciar {
      width: 100%;
      max-width: 290px;
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #botao-iniciar:disabled {
      opacity: 0.65;
    }

    #botao-som {
      position: fixed;
      z-index: 50;
      top: calc(18px + env(safe-area-inset-top));
      right: calc(18px + env(safe-area-inset-right));
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #orientacao {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 470px;
      padding: 13px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      pointer-events: none;
    }

    #mensagem-erro {
      position: fixed;
      z-index: 110;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 40px);
      max-width: 430px;
      padding: 20px;
      border-radius: 10px;
      background: rgba(120, 0, 0, 0.96);
      color: #ffffff;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- Tela inicial -->
  <div id="tela-inicial">
    <div id="conteudo-inicial">

      <h1>Experiência em realidade aumentada</h1>

      <p>
        Toque no botão abaixo, autorize o uso da câmera e aponte o celular
        para a imagem indicada na exposição.
      </p>

      <button id="botao-iniciar" type="button">
        Iniciar experiência
      </button>

    </div>
  </div>

  <!-- Botão de áudio -->
  <button id="botao-som" class="oculto" type="button">
    Ativar som
  </button>

  <!-- Mensagem de orientação -->
  <div id="orientacao" class="oculto">
    Aponte a câmera para a imagem indicada.
  </div>

  <!-- Mensagem de erro -->
  <div id="mensagem-erro" class="oculto"></div>

  <!-- Cena de realidade aumentada -->
  <a-scene
    id="cena-ra"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      sortObjects: true;
    "
    background="transparent: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
  >

    <a-assets timeout="30000">

      <video
        id="video-ra"
        src="./video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="marcador"
      mindar-image-target="targetIndex: 0"
    >

      <!--
        Vídeo horizontal 16:9.

        Para vídeo vertical:
        width="0.5625"
        height="1"

        Para vídeo quadrado:
        width="1"
        height="1"
      -->
      <a-plane
        id="plano-video"
        position="0 0 0.01"
        rotation="0 0 0"
        width="1"
        height="0.5625"
        material="
          src: #video-ra;
          shader: flat;
          side: double;
          transparent: false;
        "
      ></a-plane>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cena = document.querySelector("#cena-ra");
      const marcador = document.querySelector("#marcador");
      const videoRA = document.querySelector("#video-ra");
      const planoVideo = document.querySelector("#plano-video");

      const telaInicial = document.querySelector("#tela-inicial");
      const botaoIniciar = document.querySelector("#botao-iniciar");
      const botaoSom = document.querySelector("#botao-som");
      const orientacao = document.querySelector("#orientacao");
      const mensagemErro = document.querySelector("#mensagem-erro");

      let experienciaIniciada = false;
      let marcadorEncontrado = false;
      let somAtivado = false;
      let temporizadorErro = null;

      function mostrarErro(texto) {
        clearTimeout(temporizadorErro);

        mensagemErro.textContent = texto;
        mensagemErro.classList.remove("oculto");

        temporizadorErro = setTimeout(() => {
          mensagemErro.classList.add("oculto");
        }, 5000);
      }

      /*
       * Torna o fundo do renderer verdadeiramente transparente.
       * A imagem da câmera permanece por trás do canvas.
       */
      function tornarCanvasTransparente() {
        if (!cena.renderer) {
          return;
        }

        cena.renderer.setClearColor(0x000000, 0);
        cena.renderer.setClearAlpha(0);

        if (cena.canvas) {
          cena.canvas.style.background = "transparent";
        }
      }

      function atualizarTexturaVideo() {
        const objeto = planoVideo.getObject3D("mesh");

        if (!objeto || !objeto.material) {
          return;
        }

        objeto.material.needsUpdate = true;

        if (objeto.material.map) {
          objeto.material.map.needsUpdate = true;
        }
      }

      /*
       * Ajusta somente o vídeo da câmera.
       * Não altera o tamanho interno do renderer, para evitar
       * que a projeção da realidade aumentada fique deformada.
       */
      function ajustarVideoDaCamera() {
        const videos = [...document.querySelectorAll("video")];

        const videoCamera = videos.find(
          (elemento) => elemento.id !== "video-ra"
        );

        if (!videoCamera) {
          return;
        }

        Object.assign(videoCamera.style, {
          position: "fixed",
          top: "0",
          left: "0",
          right: "0",
          bottom: "0",
          width: "100vw",
          height: "100dvh",
          minWidth: "100vw",
          minHeight: "100dvh",
          maxWidth: "none",
          maxHeight: "none",
          objectFit: "cover",
          objectPosition: "center center",
          margin: "0",
          padding: "0",
          transform: "none",
          zIndex: "0",
          display: "block",
          visibility: "visible",
          opacity: "1"
        });
      }

      /*
       * O MindAR cria o vídeo da câmera depois do carregamento.
       * Por isso, o ajuste é repetido algumas vezes.
       */
      function reforcarVisualizacao() {
        const atrasos = [
          0,
          100,
          300,
          600,
          1000,
          1600,
          2500
        ];

        atrasos.forEach((atraso) => {
          setTimeout(() => {
            tornarCanvasTransparente();
            ajustarVideoDaCamera();
          }, atraso);
        });
      }

      const observador = new MutationObserver(() => {
        ajustarVideoDaCamera();
        tornarCanvasTransparente();
      });

      observador.observe(document.body, {
        childList: true,
        subtree: true
      });

      cena.addEventListener("loaded", () => {
        tornarCanvasTransparente();
        reforcarVisualizacao();
      });

      /*
       * O evento arReady indica que o MindAR iniciou a câmera.
       */
      cena.addEventListener("arReady", () => {
        reforcarVisualizacao();
      });

      cena.addEventListener("arError", () => {
        mostrarErro(
          "Não foi possível iniciar a câmera. " +
          "Verifique a permissão do navegador."
        );
      });

      videoRA.addEventListener("loadedmetadata", () => {
        atualizarTexturaVideo();
      });

      videoRA.addEventListener("canplay", () => {
        atualizarTexturaVideo();
      });

      videoRA.addEventListener("playing", () => {
        atualizarTexturaVideo();
      });

      videoRA.addEventListener("error", () => {
        console.error("Erro no vídeo:", videoRA.error);

        mostrarErro(
          "O vídeo não pôde ser carregado. Verifique se está em MP4, " +
          "com vídeo H.264, áudio AAC e formato de pixel yuv420p."
        );
      });

      botaoIniciar.addEventListener("click", async () => {
        botaoIniciar.disabled = true;
        botaoIniciar.textContent = "Iniciando...";

        try {
          videoRA.muted = true;
          videoRA.load();

          /*
           * Libera a reprodução durante o clique do visitante.
           */
          await videoRA.play();
          atualizarTexturaVideo();

          videoRA.pause();
          videoRA.currentTime = 0;

          const sistemaAR = cena.systems["mindar-image-system"];

          if (!sistemaAR) {
            throw new Error(
              "O sistema MindAR ainda não terminou de carregar."
            );
          }

          tornarCanvasTransparente();

          await sistemaAR.start();

          experienciaIniciada = true;

          telaInicial.classList.add("oculto");
          botaoSom.classList.remove("oculto");
          orientacao.classList.remove("oculto");

          orientacao.textContent =
            "Aponte a câmera para a imagem indicada.";

          reforcarVisualizacao();
        } catch (erro) {
          console.error("Erro ao iniciar:", erro);

          botaoIniciar.disabled = false;
          botaoIniciar.textContent = "Tentar novamente";

          mostrarErro(
            "Não foi possível iniciar a experiência. " +
            "Verifique a autorização da câmera e tente novamente."
          );
        }
      });

      botaoSom.addEventListener("click", async () => {
        try {
          if (!somAtivado) {
            somAtivado = true;
            videoRA.muted = false;
            botaoSom.textContent = "Desativar som";

            if (marcadorEncontrado) {
              await videoRA.play();
              atualizarTexturaVideo();
            }
          } else {
            somAtivado = false;
            videoRA.muted = true;
            botaoSom.textContent = "Ativar som";
          }

          orientacao.textContent = marcadorEncontrado
            ? (
                somAtivado
                  ? "Imagem reconhecida. Vídeo em reprodução."
                  : "Imagem reconhecida. Toque em “Ativar som” para ouvir."
              )
            : "Aponte a câmera para a imagem indicada.";
        } catch (erro) {
          console.error("Erro ao alterar o áudio:", erro);

          somAtivado = false;
          videoRA.muted = true;
          botaoSom.textContent = "Ativar som";

          mostrarErro(
            "O navegador não permitiu ativar o som. " +
            "Toque novamente no botão."
          );
        }
      });

      marcador.addEventListener("targetFound", async () => {
        if (!experienciaIniciada) {
          return;
        }

        marcadorEncontrado = true;

        orientacao.textContent = somAtivado
          ? "Imagem reconhecida. Vídeo em reprodução."
          : "Imagem reconhecida. Toque em “Ativar som” para ouvir.";

        try {
          videoRA.muted = !somAtivado;

          await videoRA.play();

          atualizarTexturaVideo();
          tornarCanvasTransparente();
          ajustarVideoDaCamera();

          let atualizacoes = 0;

          const intervalo = setInterval(() => {
            atualizarTexturaVideo();
            tornarCanvasTransparente();

            atualizacoes += 1;

            if (atualizacoes >= 40 || videoRA.paused) {
              clearInterval(intervalo);
            }
          }, 100);
        } catch (erro) {
          console.error("Erro ao reproduzir o vídeo:", erro);

          mostrarErro(
            "O vídeo não iniciou automaticamente. " +
            "Toque em “Ativar som”."
          );
        }
      });

      marcador.addEventListener("targetLost", () => {
        marcadorEncontrado = false;
        videoRA.pause();

        orientacao.textContent =
          "Imagem não encontrada. Aponte novamente para o marcador.";
      });

      window.addEventListener("resize", reforcarVisualizacao);

      window.addEventListener("orientationchange", () => {
        setTimeout(reforcarVisualizacao, 300);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          reforcarVisualizacao
        );
      }

      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "hidden") {
          videoRA.pause();
          return;
        }

        reforcarVisualizacao();

        if (marcadorEncontrado) {
          try {
            await videoRA.play();
            atualizarTexturaVideo();
          } catch (erro) {
            console.error("Não foi possível retomar o vídeo:", erro);
          }
        }
      });
    });
  </script>

</body>
</html>
