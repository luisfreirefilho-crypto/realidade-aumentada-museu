<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Realidade Aumentada — Museu</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    #cena-ra {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    .a-canvas,
    canvas.a-canvas,
    canvas[data-aframe-canvas] {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    video:not(#video-player) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000000 !important;
      z-index: 0 !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal,
    .a-dialog,
    .a-loader,
    .a-loader-title {
      display: none !important;
    }

    #tela-inicial {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100dvh;
      padding: 24px;
      background: rgba(0, 0, 0, 0.94);
      color: #ffffff;
      text-align: center;
    }

    #conteudo-inicial {
      width: 100%;
      max-width: 430px;
    }

    #conteudo-inicial h1 {
      margin: 0 0 16px;
      font-size: 25px;
      line-height: 1.2;
    }

    #conteudo-inicial p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.5;
    }

    #botao-iniciar {
      width: 100%;
      max-width: 290px;
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #botao-iniciar:disabled {
      opacity: 0.65;
    }

    #orientacao {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 470px;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /*
     * O vídeo ocupa quase toda a largura da tela.
     */
    #camada-video {
      position: fixed;
      z-index: 70;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100dvh;
      padding:
        calc(58px + env(safe-area-inset-top))
        10px
        calc(70px + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    #janela-video {
      position: relative;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      background: #000000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.48);
      pointer-events: auto;
    }

    #video-player {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78dvh;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000000;
    }

    /*
     * Controles compactos sobrepostos ao vídeo.
     */
    #controles-video {
      position: absolute;
      z-index: 5;
      right: 8px;
      bottom: 8px;
      left: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
    }

    .botao-controle {
      flex: 1;
      min-width: 0;
      min-height: 38px;
      padding: 8px 6px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: rgba(20, 20, 20, 0.82);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      cursor: pointer;
    }

    #botao-fechar {
      flex: 0 0 42px;
      width: 42px;
      font-size: 20px;
      background: rgba(105, 10, 10, 0.88);
    }

    #mensagem-erro {
      position: fixed;
      z-index: 120;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 40px);
      max-width: 430px;
      padding: 20px;
      border-radius: 10px;
      background: rgba(120, 0, 0, 0.96);
      color: #ffffff;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .oculto {
      display: none !important;
    }

    .invisivel {
      opacity: 0;
    }

    @media (orientation: landscape) {
      #camada-video {
        padding: 10px 18px;
      }

      #janela-video {
        width: auto;
        max-width: 92vw;
        max-height: 92dvh;
      }

      #video-player {
        width: auto;
        max-width: 92vw;
        height: 88dvh;
        max-height: 88dvh;
      }
    }
  </style>
</head>

<body>

  <div id="tela-inicial">
    <div id="conteudo-inicial">

      <h1>Experiência em realidade aumentada</h1>

      <p>
        Toque no botão abaixo, autorize o uso da câmera e aponte o celular
        para a imagem indicada na exposição.
      </p>

      <button id="botao-iniciar" type="button">
        Iniciar experiência
      </button>

    </div>
  </div>

  <div id="orientacao" class="oculto">
    Aponte a câmera para a imagem indicada.
  </div>

  <div id="camada-video" class="oculto">

    <div id="janela-video">

      <video
        id="video-player"
        src="./video.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
      ></video>

      <div id="controles-video">

        <button
          id="botao-pausar"
          class="botao-controle"
          type="button"
          aria-label="Pausar ou continuar"
        >
          Pausar
        </button>

        <button
          id="botao-som"
          class="botao-controle"
          type="button"
          aria-label="Ativar ou desativar som"
        >
          Ativar som
        </button>

        <button
          id="botao-reiniciar"
          class="botao-controle"
          type="button"
          aria-label="Reiniciar vídeo"
        >
          Reiniciar
        </button>

        <button
          id="botao-fechar"
          class="botao-controle"
          type="button"
          aria-label="Fechar vídeo"
        >
          ×
        </button>

      </div>

    </div>

  </div>

  <div id="mensagem-erro" class="oculto"></div>

  <a-scene
    id="cena-ra"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    background="transparent: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="marcador"
      mindar-image-target="targetIndex: 0"
    ></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cena = document.querySelector("#cena-ra");
      const marcador = document.querySelector("#marcador");

      const telaInicial = document.querySelector("#tela-inicial");
      const botaoIniciar = document.querySelector("#botao-iniciar");
      const orientacao = document.querySelector("#orientacao");

      const camadaVideo = document.querySelector("#camada-video");
      const videoPlayer = document.querySelector("#video-player");

      const botaoPausar = document.querySelector("#botao-pausar");
      const botaoSom = document.querySelector("#botao-som");
      const botaoReiniciar = document.querySelector("#botao-reiniciar");
      const botaoFechar = document.querySelector("#botao-fechar");

      const mensagemErro = document.querySelector("#mensagem-erro");

      let experienciaIniciada = false;
      let videoAberto = false;
      let somAtivado = false;
      let temporizadorErro = null;
      let temporizadorOrientacao = null;

      function mostrarErro(texto) {
        clearTimeout(temporizadorErro);

        mensagemErro.textContent = texto;
        mensagemErro.classList.remove("oculto");

        temporizadorErro = setTimeout(() => {
          mensagemErro.classList.add("oculto");
        }, 5000);
      }

      function mostrarOrientacao(texto, ocultarDepois = false) {
        clearTimeout(temporizadorOrientacao);

        orientacao.textContent = texto;
        orientacao.classList.remove("oculto", "invisivel");

        if (ocultarDepois) {
          temporizadorOrientacao = setTimeout(() => {
            orientacao.classList.add("invisivel");
          }, 3000);
        }
      }

      function tornarCanvasTransparente() {
        if (!cena.renderer) {
          return;
        }

        cena.renderer.setClearColor(0x000000, 0);
        cena.renderer.setClearAlpha(0);

        if (cena.canvas) {
          cena.canvas.style.background = "transparent";
        }
      }

      function ajustarVideoDaCamera() {
        const videos = [...document.querySelectorAll("video")];

        const videoCamera = videos.find(
          (elemento) => elemento.id !== "video-player"
        );

        if (!videoCamera) {
          return;
        }

        Object.assign(videoCamera.style, {
          position: "fixed",
          top: "0",
          left: "0",
          right: "0",
          bottom: "0",
          width: "100vw",
          height: "100dvh",
          minWidth: "100vw",
          minHeight: "100dvh",
          maxWidth: "none",
          maxHeight: "none",
          objectFit: "cover",
          objectPosition: "center center",
          margin: "0",
          padding: "0",
          transform: "none",
          zIndex: "0",
          display: "block",
          visibility: "visible",
          opacity: "1"
        });
      }

      function reforcarVisualizacao() {
        [0, 100, 300, 600, 1000, 1600, 2500].forEach((atraso) => {
          setTimeout(() => {
            tornarCanvasTransparente();
            ajustarVideoDaCamera();
          }, atraso);
        });
      }

      async function abrirVideo() {
        if (videoAberto) {
          return;
        }

        videoAberto = true;
        camadaVideo.classList.remove("oculto");

        videoPlayer.muted = true;
        somAtivado = false;

        botaoSom.textContent = "Ativar som";
        botaoPausar.textContent = "Pausar";

        mostrarOrientacao(
          "Vídeo iniciado. Você já pode afastar a câmera da imagem.",
          true
        );

        try {
          await videoPlayer.play();
        } catch (erro) {
          console.error("Erro ao iniciar o vídeo:", erro);

          mostrarErro(
            "O vídeo não iniciou automaticamente. Toque em “Reiniciar”."
          );
        }
      }

      function fecharVideo() {
        videoPlayer.pause();
        videoPlayer.currentTime = 0;
        videoPlayer.muted = true;

        videoAberto = false;
        somAtivado = false;

        camadaVideo.classList.add("oculto");

        botaoSom.textContent = "Ativar som";
        botaoPausar.textContent = "Pausar";

        mostrarOrientacao(
          "Aponte a câmera novamente para a imagem indicada."
        );
      }

      const observador = new MutationObserver(() => {
        ajustarVideoDaCamera();
        tornarCanvasTransparente();
      });

      observador.observe(document.body, {
        childList: true,
        subtree: true
      });

      cena.addEventListener("loaded", () => {
        tornarCanvasTransparente();
        reforcarVisualizacao();
      });

      cena.addEventListener("arReady", () => {
        reforcarVisualizacao();
      });

      cena.addEventListener("arError", () => {
        mostrarErro(
          "Não foi possível iniciar a câmera. Verifique a permissão do navegador."
        );
      });

      botaoIniciar.addEventListener("click", async () => {
        botaoIniciar.disabled = true;
        botaoIniciar.textContent = "Iniciando...";

        try {
          videoPlayer.muted = true;
          videoPlayer.load();

          await videoPlayer.play();
          videoPlayer.pause();
          videoPlayer.currentTime = 0;

          const sistemaAR = cena.systems["mindar-image-system"];

          if (!sistemaAR) {
            throw new Error(
              "O sistema MindAR ainda não terminou de carregar."
            );
          }

          tornarCanvasTransparente();
          await sistemaAR.start();

          experienciaIniciada = true;

          telaInicial.classList.add("oculto");
          orientacao.classList.remove("oculto");

          mostrarOrientacao(
            "Aponte a câmera para a imagem indicada."
          );

          reforcarVisualizacao();
        } catch (erro) {
          console.error("Erro ao iniciar:", erro);

          botaoIniciar.disabled = false;
          botaoIniciar.textContent = "Tentar novamente";

          mostrarErro(
            "Não foi possível iniciar a experiência. " +
            "Verifique a autorização da câmera e tente novamente."
          );
        }
      });

      marcador.addEventListener("targetFound", async () => {
        if (!experienciaIniciada || videoAberto) {
          return;
        }

        await abrirVideo();
      });

      marcador.addEventListener("targetLost", () => {
        if (!videoAberto) {
          mostrarOrientacao(
            "Imagem não encontrada. Aponte novamente para o marcador."
          );
        }
      });

      botaoPausar.addEventListener("click", async () => {
        if (videoPlayer.paused) {
          try {
            await videoPlayer.play();
            botaoPausar.textContent = "Pausar";
          } catch (erro) {
            mostrarErro("Não foi possível continuar o vídeo.");
          }
        } else {
          videoPlayer.pause();
          botaoPausar.textContent = "Continuar";
        }
      });

      botaoSom.addEventListener("click", async () => {
        try {
          if (!somAtivado) {
            videoPlayer.muted = false;
            somAtivado = true;
            botaoSom.textContent = "Sem som";

            if (videoPlayer.paused) {
              await videoPlayer.play();
              botaoPausar.textContent = "Pausar";
            }
          } else {
            videoPlayer.muted = true;
            somAtivado = false;
            botaoSom.textContent = "Ativar som";
          }
        } catch (erro) {
          videoPlayer.muted = true;
          somAtivado = false;
          botaoSom.textContent = "Ativar som";

          mostrarErro(
            "O navegador não permitiu ativar o som."
          );
        }
      });

      botaoReiniciar.addEventListener("click", async () => {
        try {
          videoPlayer.currentTime = 0;
          await videoPlayer.play();
          botaoPausar.textContent = "Pausar";
        } catch (erro) {
          mostrarErro("Não foi possível reiniciar o vídeo.");
        }
      });

      botaoFechar.addEventListener("click", fecharVideo);

      videoPlayer.addEventListener("ended", () => {
        botaoPausar.textContent = "Continuar";

        mostrarOrientacao(
          "Vídeo encerrado. Reinicie ou feche para reconhecer novamente."
        );
      });

      videoPlayer.addEventListener("error", () => {
        mostrarErro(
          "O vídeo não pôde ser carregado. Verifique o arquivo MP4."
        );
      });

      window.addEventListener("resize", reforcarVisualizacao);

      window.addEventListener("orientationchange", () => {
        setTimeout(reforcarVisualizacao, 300);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          reforcarVisualizacao
        );
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          videoPlayer.pause();
          botaoPausar.textContent = "Continuar";
        } else {
          reforcarVisualizacao();
        }
      });
    });
  </script>

</body>
</html>
