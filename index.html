<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Realidade Aumentada — Museu</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    /*
     * Cena de realidade aumentada em tela cheia.
     */
    #cena-ra {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    /*
     * Canvas transparente para permitir a visualização da câmera.
     */
    .a-canvas,
    canvas.a-canvas,
    canvas[data-aframe-canvas] {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    /*
     * Vídeo criado automaticamente pelo MindAR para exibir a câmera.
     * O vídeo de conteúdo possui ID video-ra e não recebe estas regras.
     */
    video:not(#video-ra) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000000 !important;
      z-index: 0 !important;
    }

    /*
     * O vídeo de conteúdo é usado somente como textura.
     */
    #video-ra {
      display: none !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal,
    .a-dialog,
    .a-loader,
    .a-loader-title {
      display: none !important;
    }

    /*
     * Tela inicial.
     */
    #tela-inicial {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100dvh;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(24px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(24px + env(safe-area-inset-left));
      background: rgba(0, 0, 0, 0.94);
      color: #ffffff;
      text-align: center;
    }

    #conteudo-inicial {
      width: 100%;
      max-width: 430px;
    }

    #conteudo-inicial h1 {
      margin: 0 0 16px;
      font-size: 25px;
      line-height: 1.2;
    }

    #conteudo-inicial p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.5;
    }

    #botao-iniciar {
      width: 100%;
      max-width: 290px;
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #botao-iniciar:disabled {
      opacity: 0.65;
    }

    /*
     * Mensagem de orientação.
     */
    #orientacao {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 470px;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /*
     * Barra de progresso do vídeo.
     */
    #controle-progresso {
      position: fixed;
      z-index: 60;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 560px;
      padding: 10px 13px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
    }

    #linha-tempo {
      width: 100%;
      height: 24px;
      margin: 0;
      cursor: pointer;
      accent-color: #ffffff;
    }

    #tempos-video {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
    }

    /*
     * Botão de som.
     * Aparece somente enquanto o alvo do vídeo estiver visível.
     */
    #botao-som {
      position: fixed;
      z-index: 65;
      top: calc(18px + env(safe-area-inset-top));
      right: calc(18px + env(safe-area-inset-right));
      padding: 11px 15px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.76);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /*
     * Mensagem de erro.
     */
    #mensagem-erro {
      position: fixed;
      z-index: 120;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 40px);
      max-width: 430px;
      padding: 20px;
      border-radius: 10px;
      background: rgba(120, 0, 0, 0.96);
      color: #ffffff;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .oculto {
      display: none !important;
    }

    .invisivel {
      opacity: 0;
    }
  </style>
</head>

<body>

  <!-- Tela inicial -->
  <div id="tela-inicial">
    <div id="conteudo-inicial">

      <h1>Experiência em realidade aumentada</h1>

      <p>
        Toque no botão abaixo, autorize o uso da câmera e percorra os pontos
        de realidade aumentada indicados na exposição.
      </p>

      <button id="botao-iniciar" type="button">
        Iniciar experiência
      </button>

    </div>
  </div>

  <!-- Orientação inferior -->
  <div id="orientacao" class="oculto">
    Aponte a câmera para uma das imagens indicadas.
  </div>

  <!-- Linha do tempo -->
  <div id="controle-progresso" class="oculto">

    <input
      id="linha-tempo"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
      aria-label="Posição do vídeo"
    >

    <div id="tempos-video">
      <span id="tempo-atual">0:00</span>
      <span id="tempo-total">0:00</span>
    </div>

  </div>

  <!-- Botão de áudio -->
  <button
    id="botao-som"
    class="oculto"
    type="button"
  >
    Ativar som
  </button>

  <!-- Mensagem de erro -->
  <div id="mensagem-erro" class="oculto"></div>

  <!-- Cena de realidade aumentada -->
  <a-scene
    id="cena-ra"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      maxTrack: 1;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      sortObjects: true;
    "
    background="transparent: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
  >

    <a-assets timeout="30000">

      <!-- Vídeo acionado pelo alvo 0 -->
      <video
        id="video-ra"
        src="./video.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
      ></video>

      <!-- Primeiro PNG acionado pelo alvo 1 -->
      <img
        id="conteudo-png-1"
        src="./imagem-ra-1.png"
        crossorigin="anonymous"
      >

      <!-- Segundo PNG acionado pelo alvo 2 -->
      <img
        id="conteudo-png-2"
        src="./imagem-ra-2.png"
        crossorigin="anonymous"
      >

    </a-assets>

    <!-- Câmera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!--
      ALVO 0
      Primeira imagem adicionada ao targets.mind.
    -->
    <a-entity
      id="marcador-video"
      mindar-image-target="targetIndex: 0"
    >

      <a-plane
        id="plano-video"
        position="0 0 0.02"
        width="1"
        height="0.5625"
        material="
          src: #video-ra;
          shader: flat;
          side: double;
          transparent: false;
        "
      ></a-plane>

    </a-entity>

    <!--
      ALVO 1
      Segunda imagem adicionada ao targets.mind.
    -->
    <a-entity
      id="marcador-png-1"
      mindar-image-target="targetIndex: 1"
    >

      <a-plane
        id="plano-png-1"
        position="0 0 0.03"
        width="1"
        height="1"
        material="
          src: #conteudo-png-1;
          shader: flat;
          transparent: true;
          alphaTest: 0.01;
          side: double;
        "
      ></a-plane>

    </a-entity>

    <!--
      ALVO 2
      Terceira imagem adicionada ao targets.mind.
    -->
    <a-entity
      id="marcador-png-2"
      mindar-image-target="targetIndex: 2"
    >

      <a-plane
        id="plano-png-2"
        position="0 0 0.03"
        width="1"
        height="1"
        material="
          src: #conteudo-png-2;
          shader: flat;
          transparent: true;
          alphaTest: 0.01;
          side: double;
        "
      ></a-plane>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cena =
        document.querySelector("#cena-ra");

      const marcadorVideo =
        document.querySelector("#marcador-video");

      const marcadorPng1 =
        document.querySelector("#marcador-png-1");

      const marcadorPng2 =
        document.querySelector("#marcador-png-2");

      const videoRA =
        document.querySelector("#video-ra");

      const planoVideo =
        document.querySelector("#plano-video");

      const imagemPng1 =
        document.querySelector("#conteudo-png-1");

      const imagemPng2 =
        document.querySelector("#conteudo-png-2");

      const planoPng1 =
        document.querySelector("#plano-png-1");

      const planoPng2 =
        document.querySelector("#plano-png-2");

      const telaInicial =
        document.querySelector("#tela-inicial");

      const botaoIniciar =
        document.querySelector("#botao-iniciar");

      const botaoSom =
        document.querySelector("#botao-som");

      const orientacao =
        document.querySelector("#orientacao");

      const controleProgresso =
        document.querySelector("#controle-progresso");

      const linhaTempo =
        document.querySelector("#linha-tempo");

      const tempoAtual =
        document.querySelector("#tempo-atual");

      const tempoTotal =
        document.querySelector("#tempo-total");

      const mensagemErro =
        document.querySelector("#mensagem-erro");

      let experienciaIniciada = false;
      let alvoVideoVisivel = false;
      let usuarioMovendoLinha = false;
      let somAtivado = false;

      let temporizadorErro = null;
      let temporizadorOrientacao = null;

      /*
       * Exibe mensagem de erro temporária.
       */
      function mostrarErro(texto) {
        clearTimeout(temporizadorErro);

        mensagemErro.textContent = texto;
        mensagemErro.classList.remove("oculto");

        temporizadorErro = setTimeout(() => {
          mensagemErro.classList.add("oculto");
        }, 5000);
      }

      /*
       * Exibe mensagem inferior.
       */
      function mostrarOrientacao(
        texto,
        ocultarDepois = false
      ) {
        clearTimeout(temporizadorOrientacao);

        orientacao.textContent = texto;

        orientacao.classList.remove(
          "oculto",
          "invisivel"
        );

        if (ocultarDepois) {
          temporizadorOrientacao = setTimeout(() => {
            orientacao.classList.add("invisivel");
          }, 2500);
        }
      }

      /*
       * Formata tempo como minutos e segundos.
       */
      function formatarTempo(segundos) {
        if (
          !Number.isFinite(segundos) ||
          segundos < 0
        ) {
          return "0:00";
        }

        const minutos =
          Math.floor(segundos / 60);

        const segundosRestantes =
          Math.floor(segundos % 60)
            .toString()
            .padStart(2, "0");

        return `${minutos}:${segundosRestantes}`;
      }

      /*
       * Mantém o fundo do canvas transparente.
       */
      function tornarCanvasTransparente() {
        if (!cena.renderer) {
          return;
        }

        cena.renderer.setClearColor(0x000000, 0);
        cena.renderer.setClearAlpha(0);

        if (cena.canvas) {
          cena.canvas.style.background =
            "transparent";
        }
      }

      /*
       * Ajusta o vídeo real da câmera criado pelo MindAR.
       */
      function ajustarVideoDaCamera() {
        const videos =
          [...document.querySelectorAll("video")];

        const videoCamera = videos.find(
          (elemento) =>
            elemento.id !== "video-ra"
        );

        if (!videoCamera) {
          return;
        }

        Object.assign(videoCamera.style, {
          position: "fixed",
          top: "0",
          left: "0",
          right: "0",
          bottom: "0",
          width: "100vw",
          height: "100dvh",
          minWidth: "100vw",
          minHeight: "100dvh",
          maxWidth: "none",
          maxHeight: "none",
          objectFit: "cover",
          objectPosition: "center center",
          margin: "0",
          padding: "0",
          transform: "none",
          zIndex: "0",
          display: "block",
          visibility: "visible",
          opacity: "1"
        });
      }

      /*
       * Reforça os ajustes após a criação da câmera.
       */
      function reforcarVisualizacao() {
        [
          0,
          100,
          300,
          600,
          1000,
          1600,
          2500
        ].forEach((atraso) => {
          setTimeout(() => {
            tornarCanvasTransparente();
            ajustarVideoDaCamera();
          }, atraso);
        });
      }

      /*
       * Atualiza a textura do vídeo.
       */
      function atualizarTexturaVideo() {
        const objeto =
          planoVideo.getObject3D("mesh");

        if (!objeto || !objeto.material) {
          return;
        }

        objeto.material.needsUpdate = true;

        if (objeto.material.map) {
          objeto.material.map.needsUpdate = true;
        }
      }

      /*
       * Ajusta a proporção original e dobra o tamanho dos PNGs.
       */
      function ajustarProporcaoPng(
        elementoImagem,
        elementoPlano
      ) {
        const aplicarTamanho = () => {
          const larguraOriginal =
            elementoImagem.naturalWidth;

          const alturaOriginal =
            elementoImagem.naturalHeight;

          if (
            !larguraOriginal ||
            !alturaOriginal
          ) {
            return;
          }

          const proporcao =
            larguraOriginal / alturaOriginal;

          /*
           * Escala 2 representa aumento de 100%.
           */
          const escala = 1.8;

          let larguraPlano;
          let alturaPlano;

          if (proporcao >= 1) {
            larguraPlano = escala;
            alturaPlano = escala / proporcao;
          } else {
            larguraPlano = proporcao * escala;
            alturaPlano = escala;
          }

          elementoPlano.setAttribute(
            "width",
            larguraPlano
          );

          elementoPlano.setAttribute(
            "height",
            alturaPlano
          );
        };

        if (
          elementoImagem.complete &&
          elementoImagem.naturalWidth
        ) {
          aplicarTamanho();
        } else {
          elementoImagem.addEventListener(
            "load",
            aplicarTamanho,
            { once: true }
          );
        }
      }

      /*
       * Observa quando o MindAR cria a câmera.
       */
      const observador =
        new MutationObserver(() => {
          ajustarVideoDaCamera();
          tornarCanvasTransparente();
        });

      observador.observe(document.body, {
        childList: true,
        subtree: true
      });

      /*
       * Ajusta os dois PNGs.
       */
      ajustarProporcaoPng(
        imagemPng1,
        planoPng1
      );

      ajustarProporcaoPng(
        imagemPng2,
        planoPng2
      );

      /*
       * Eventos de carregamento da cena.
       */
      cena.addEventListener("loaded", () => {
        tornarCanvasTransparente();
        reforcarVisualizacao();
      });

      cena.addEventListener("arReady", () => {
        reforcarVisualizacao();
      });

      cena.addEventListener("arError", () => {
        mostrarErro(
          "Não foi possível iniciar a câmera. " +
          "Verifique a permissão do navegador."
        );
      });

      /*
       * Eventos do vídeo.
       */
      videoRA.addEventListener(
        "loadedmetadata",
        () => {
          linhaTempo.max =
            videoRA.duration || 0;

          tempoTotal.textContent =
            formatarTempo(videoRA.duration);

          atualizarTexturaVideo();
        }
      );

      videoRA.addEventListener(
        "canplay",
        atualizarTexturaVideo
      );

      videoRA.addEventListener(
        "playing",
        atualizarTexturaVideo
      );

      videoRA.addEventListener(
        "timeupdate",
        () => {
          if (!usuarioMovendoLinha) {
            linhaTempo.value =
              videoRA.currentTime || 0;
          }

          tempoAtual.textContent =
            formatarTempo(videoRA.currentTime);
        }
      );

      videoRA.addEventListener(
        "ended",
        () => {
          videoRA.pause();
          videoRA.currentTime = 0;

          linhaTempo.value = 0;
          tempoAtual.textContent = "0:00";

          mostrarOrientacao(
            "Vídeo encerrado. Afaste e aponte novamente para reiniciar."
          );
        }
      );

      videoRA.addEventListener(
        "error",
        () => {
          mostrarErro(
            "O vídeo não pôde ser carregado. " +
            "Verifique o arquivo video.mp4."
          );
        }
      );

      /*
       * Linha do tempo.
       */
      linhaTempo.addEventListener(
        "input",
        () => {
          usuarioMovendoLinha = true;

          const novoTempo =
            Number(linhaTempo.value);

          tempoAtual.textContent =
            formatarTempo(novoTempo);
        }
      );

      linhaTempo.addEventListener(
        "change",
        async () => {
          const novoTempo =
            Number(linhaTempo.value);

          videoRA.currentTime = novoTempo;
          usuarioMovendoLinha = false;

          atualizarTexturaVideo();

          if (alvoVideoVisivel) {
            try {
              await videoRA.play();
            } catch (erro) {
              console.error(
                "Não foi possível continuar o vídeo:",
                erro
              );
            }
          }
        }
      );

      /*
       * Ativa e desativa o som.
       */
      botaoSom.addEventListener(
        "click",
        async () => {
          try {
            if (!somAtivado) {
              videoRA.muted = false;
              somAtivado = true;

              botaoSom.textContent =
                "Desativar som";

              if (
                alvoVideoVisivel &&
                videoRA.paused
              ) {
                await videoRA.play();
              }
            } else {
              videoRA.muted = true;
              somAtivado = false;

              botaoSom.textContent =
                "Ativar som";
            }
          } catch (erro) {
            console.error(
              "Não foi possível alterar o som:",
              erro
            );

            videoRA.muted = true;
            somAtivado = false;

            botaoSom.textContent =
              "Ativar som";

            mostrarErro(
              "O navegador não permitiu ativar o áudio. " +
              "Toque novamente no botão."
            );
          }
        }
      );

      /*
       * Inicia a experiência.
       */
      botaoIniciar.addEventListener(
        "click",
        async () => {
          botaoIniciar.disabled = true;

          botaoIniciar.textContent =
            "Iniciando...";

          try {
            /*
             * Prepara o vídeo durante o primeiro toque.
             */
            videoRA.muted = true;
            videoRA.load();

            await videoRA.play();

            atualizarTexturaVideo();

            videoRA.pause();
            videoRA.currentTime = 0;

            const sistemaAR =
              cena.systems["mindar-image-system"];

            if (!sistemaAR) {
              throw new Error(
                "O sistema MindAR ainda não terminou de carregar."
              );
            }

            tornarCanvasTransparente();

            await sistemaAR.start();

            experienciaIniciada = true;

            telaInicial.classList.add("oculto");

            mostrarOrientacao(
              "Aponte a câmera para uma das imagens indicadas na exposição."
            );

            reforcarVisualizacao();
          } catch (erro) {
            console.error(
              "Erro ao iniciar:",
              erro
            );

            botaoIniciar.disabled = false;

            botaoIniciar.textContent =
              "Tentar novamente";

            mostrarErro(
              "Não foi possível iniciar a experiência. " +
              "Verifique a autorização da câmera e tente novamente."
            );
          }
        }
      );

      /*
       * ALVO 0 — vídeo.
       */
      marcadorVideo.addEventListener(
        "targetFound",
        async () => {
          if (!experienciaIniciada) {
            return;
          }

          alvoVideoVisivel = true;

          orientacao.classList.add("oculto");

          controleProgresso.classList.remove(
            "oculto"
          );

          botaoSom.classList.remove(
            "oculto"
          );

          try {
            /*
             * Mantém a preferência atual do visitante.
             */
            videoRA.muted = !somAtivado;

            await videoRA.play();

            atualizarTexturaVideo();

            let atualizacoes = 0;

            const intervalo =
              setInterval(() => {
                atualizarTexturaVideo();

                atualizacoes += 1;

                if (
                  atualizacoes >= 40 ||
                  videoRA.paused
                ) {
                  clearInterval(intervalo);
                }
              }, 100);
          } catch (erro) {
            console.error(
              "Erro ao reproduzir o vídeo:",
              erro
            );

            mostrarErro(
              "O vídeo não pôde ser iniciado."
            );
          }
        }
      );

      marcadorVideo.addEventListener(
        "targetLost",
        () => {
          alvoVideoVisivel = false;

          videoRA.pause();

          controleProgresso.classList.add(
            "oculto"
          );

          botaoSom.classList.add(
            "oculto"
          );

          mostrarOrientacao(
            "Aponte novamente para a imagem do vídeo para continuar."
          );
        }
      );

      /*
       * ALVO 1 — primeiro PNG.
       */
      marcadorPng1.addEventListener(
        "targetFound",
        () => {
          if (!experienciaIniciada) {
            return;
          }

          controleProgresso.classList.add(
            "oculto"
          );

          botaoSom.classList.add(
            "oculto"
          );

          mostrarOrientacao(
            "Conteúdo de realidade aumentada encontrado.",
            true
          );
        }
      );

      marcadorPng1.addEventListener(
        "targetLost",
        () => {
          mostrarOrientacao(
            "Continue o percurso e procure outro ponto de realidade aumentada."
          );
        }
      );

      /*
       * ALVO 2 — segundo PNG.
       */
      marcadorPng2.addEventListener(
        "targetFound",
        () => {
          if (!experienciaIniciada) {
            return;
          }

          controleProgresso.classList.add(
            "oculto"
          );

          botaoSom.classList.add(
            "oculto"
          );

          mostrarOrientacao(
            "Conteúdo de realidade aumentada encontrado.",
            true
          );
        }
      );

      marcadorPng2.addEventListener(
        "targetLost",
        () => {
          mostrarOrientacao(
            "Continue o percurso e procure outro ponto de realidade aumentada."
          );
        }
      );

      /*
       * Ajustes de tela.
       */
      window.addEventListener(
        "resize",
        reforcarVisualizacao
      );

      window.addEventListener(
        "orientationchange",
        () => {
          setTimeout(
            reforcarVisualizacao,
            300
          );
        }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener(
          "resize",
          reforcarVisualizacao
        );
      }

      document.addEventListener(
        "visibilitychange",
        () => {
          if (
            document.visibilityState ===
            "hidden"
          ) {
            videoRA.pause();
          } else {
            reforcarVisualizacao();
          }
        }
      );
    });
  </script>

</body>
</html>
